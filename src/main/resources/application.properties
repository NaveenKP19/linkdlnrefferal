spring.application.name=linkdlnrefferal

# PostgreSQL Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/linkdln_automaton}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true

# Server
server.port=${PORT:8080}

# Logging
logging.level.root=INFO
logging.level.com.personalproject.linkdlnrefferal=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Swagger
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

logging.level.org.springdoc=INFO
debug=false

jwt.secret=${JWT_SECRET}
jwt.access-token-expiration-ms=${JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}
jwt.refresh-token-expiration-ms=${JWT_REFRESH_TOKEN_EXPIRATION_MS:604800000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,https://linkdrefferal.netlify.app}
app.frontend-url=${FRONTEND_URL:http://localhost:4200}

# LinkedIn OpenID Connect
linkedin.client-id=${LINKEDIN_CLIENT_ID:}
linkedin.client-secret=${LINKEDIN_CLIENT_SECRET:}
linkedin.redirect-uri=${LINKEDIN_REDIRECT_URI:http://localhost:8080/api/v1/auth/linkedin/callback}
linkedin.scopes=${LINKEDIN_SCOPES:openid,profile,email}
linkedin.authorization-endpoint=https://www.linkedin.com/oauth/v2/authorization
linkedin.token-endpoint=https://www.linkedin.com/oauth/v2/accessToken
linkedin.user-info-endpoint=https://api.linkedin.com/v2/userinfo
linkedin.discovery-endpoint=https://www.linkedin.com/oauth/.well-known/openid-configuration
linkedin.state-ttl-seconds=${LINKEDIN_STATE_TTL_SECONDS:300}
linkedin.exchange-code-ttl-seconds=${LINKEDIN_EXCHANGE_CODE_TTL_SECONDS:600}
